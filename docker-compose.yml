version: '3.8'
services:
  mongodb:
    image: mongo:7
    container_name: hmas-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hmas_admin
      MONGO_INITDB_ROOT_PASSWORD: hmas_secret_2026
      MONGO_INITDB_DATABASE: hmas_db
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  mongo-express:
    image: mongo-express:latest
    container_name: hmas-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: hmas_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: hmas_secret_2026
      ME_CONFIG_MONGODB_URL: mongodb://hmas_admin:hmas_secret_2026@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
volumes:
  mongodb_data:
